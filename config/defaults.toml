[logging]
level = "info"
target = "stdout"
color = "auto"
file_name = "./idpd.log"
file_size_limit = 0
syslog_network = "unixgram"
syslog_address = "/dev/log"
syslog_encoding = "local"
syslog_facility = 4

[server]
address = "localhost:0"
protocol = "http"
cert_file = ""
key_file = ""
public_url = ""
trusted_proxies = [ ]
trusted_headers = [ ]
allowed_origins = [ ]
access_log = ""
access_log_size_limit = 0

[store]
type = "memory"

[store.memory]

[store.sqlite]
file = "./idpd.db"

[store.postgres]
address = "localhost:5432"
db = "idpd"
user = "idpd"
password = ""

[geoip]
provider = "none"
address_url_template = "https://whois.domaintools.com/%s"
location_url_template = "https://maps.google.com/?q=%.6f,%.6f"

[geoip.none]

[geoip.maxminddb]
file = "./GeoLite2-City.mmdb"

[general]
session_cookie_name = "idpd_session"
session_cookie_domain = ""
integrity_context_key_rotation = "720h"
integrity_context_key_lifetime = "1440h"
auth_request_lifetime = "5m"

[oauth2]
enabled = true
claims = []
scopes = []
signing_key_algorithm = "RS256"
signing_key_rotation = "720h"
signing_key_lifetime = "1440h"
access_token_lifetime = "1h"
refresh_token_lifetime = "720h"
default_id_token_lifetime = "10m"

[saml2]
enabled = true
organization_name = ""
organization_url = ""
contact_email = ""

[forward]

[userstore]
type = "file"

[userstore.ldap]
urls = [ "ldaps://localhost" ]
round_robin = true
connection_limit = 0
keep_alive_timeout = "60s"
bind_dn = ""
bind_password = ""
mapping = "active_directory"

[userstore.ldap.users]
base_dn = ""
scope = "whole_subtree"
deref_aliases = "never"
filter = "(objectClass=user)"

[userstore.ldap.groups]
base_dn = ""
scope = "whole_subtree"
deref_aliases = "never"
filter = "(objectClass=group)"

[userstore.ldap.custom_mapping.user]
login = "userPrincipalName"
name = "displayName"
given_name = "givenName"
family_name = "sn"
picture = "thumbnailPhoto"
website = "wWWHomePage"
birthdate = ""
timezone = ""
locale = ""
email_addresses = "mail"
phone_numbers = "telephoneNumber"
street = "street"
locality = "l"
region = ""
postal_code = "postalCode"
country = "c"
updated_at = "whenChanged"
groups = "memberOf"

[userstore.ldap.custom_mapping.group]
name = "sAMAccountName"
members = "member"

[userstore.file]
file = ""

[userstore.demo.user]
login = "demouser"
password = ""
name = "Demo User"
given_name = "Demo"
family_name = "User"
middle_name = ""
nickname = "Demo"
picture = ""
website = ""
birthdate = 1987-06-05
timezone = ""
locale = "en"
email_addresses = [ "demo.user@localhost" ]
phone_numbers = [ "" ]
addresses = [{ formatted = "", street = "", locality = "", region = "", postal_code = "", country = "" }]
groups = { "groupId" = { name = "Demo Users" } }

[mail]
address = "localhost:587"
user = "idpd"
password = ""
from_address = ""
from_name = "IdPD"
keep_alive_timeout = "60s"
tls_mode = "starttls"
ehlo_identity = ""
